# PixPanel tarafından üretildi. Elle yapılan değişiklikler kaybolur.
# Veritabanı araçları (phpMyAdmin, Adminer) yalnızca sunucunun içinden erişilir;
# dışarıya panel üzerinden, oturum denetimiyle açılır.
server {
    listen 127.0.0.1:{{port}};
    server_name _;
    root {{web_root}};
    index index.php;
    client_max_body_size 1g;
    access_log off;

    # Araçların kendi iç klasörleri ve gizli dosyalar sunulmaz.
    location ~ /\. { return 404; }
    location ~ ^/tools/phpmyadmin/(libraries|templates|setup|vendor|sql|tmp)/ { return 404; }
    location ~ ^/webmail/(config|temp|logs|bin|SQL|installer)/ { return 404; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS {{https}};
        fastcgi_param HTTP_HOST $http_x_forwarded_host;
        # Bu sunucu yalnızca panelden erişilir; ziyaretçinin adresini panel bildirir.
        fastcgi_param REMOTE_ADDR $http_x_real_ip;
        fastcgi_param SERVER_NAME $http_x_forwarded_host;
        fastcgi_pass unix:{{socket}};
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }
}
