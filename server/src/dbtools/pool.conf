; PixPanel tarafından üretildi. Veritabanı araçlarının (phpMyAdmin, Adminer) çalıştığı havuz.
[pixpanel-tools]
user = www-data
group = www-data
listen = {{socket}}
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 60s
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 1024M
php_admin_value[post_max_size] = 1024M
php_admin_value[max_execution_time] = 600
php_admin_value[session.save_path] = {{session_dir}}
php_admin_flag[display_errors] = off
; Havuz www-data ile çalışır ve bütün sitelerin dosyalarını okuyabilir; "LOAD DATA LOCAL INFILE"
; ile bir müşteri başka müşterinin dosyalarını kendi tablosuna okutabilirdi.
php_admin_value[mysqli.allow_local_infile] = 0
