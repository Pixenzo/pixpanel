<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bakımdayız</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f6f8; color: #1c2530; }
  main { max-width: 32rem; padding: 2rem 1.5rem; text-align: center; }
  h1 { margin: 0 0 .5rem; font-size: 1.6rem; font-weight: 650; letter-spacing: -.01em; }
  p { margin: 0; color: #55606d; }
  @media (prefers-color-scheme: dark) { body { background: #12171d; color: #e7ecf1; } p { color: #9aa6b3; } }
</style>
</head>
<body>
<main>
  <h1>Kısa bir bakım arası</h1>
  <p>Sitemizde bakım çalışması yapıyoruz. Birazdan yeniden yayında olacağız; anlayışınız için teşekkürler.</p>
</main>
</body>
</html>
