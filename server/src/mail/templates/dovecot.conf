# PixPanel tarafından üretildi. Elle yapılan değişiklikler kaybolur.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols {
  imap = yes
  lmtp = yes
  sieve = yes
}

# ---- Kimlik doğrulama ----
auth_mechanisms = plain login
auth_username_format = %{user | lower}
auth_allow_cleartext = no

passdb passwd-file {
  default_password_scheme = ARGON2ID
  passwd_file_path = {{users_file}}
}
userdb passwd-file {
  passwd_file_path = {{users_file}}
}

# ---- Posta kutuları ----
mail_driver = maildir
mail_home = {{mail_root}}/%{user | domain}/%{user | username}
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = {{vmail_uid}}
last_valid_uid = {{vmail_uid}}

namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# ---- Kota ----
mail_plugins {
  quota = yes
}
quota "User quota" {
  driver = count
}

# ---- TLS ----
ssl = required
ssl_server_cert_file = {{tls_cert}}
ssl_server_key_file = {{tls_key}}
ssl_min_protocol = TLSv1.2

# ---- Protokoller ----
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
  mail_max_userip_connections = 30
}

protocol lmtp {
  mail_plugins {
    sieve = yes
  }
  postmaster_address = postmaster@%{user | domain}
}
lmtp_rcpt_check_quota = yes

# ---- Servisler ----
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

# Postfix teslimatı ve SMTP kimlik doğrulaması için soketler.
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

service stats {
  unix_listener stats-writer {
    mode = 0660
    group = vmail
  }
}

# ---- Sieve (filtreler, yönlendirme, otomatik yanıt) ----
sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}
# İstenmeyen posta olarak işaretlenen iletiler kullanıcının süzgeçlerinden önce Junk klasörüne alınır.
sieve_script before {
  type = before
  driver = file
  path = {{sieve_before}}
}
